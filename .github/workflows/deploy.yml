name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Credentials come from the account's GitHub OIDC provider, exchanged for the
# deploy role created by infra/hosting.yaml. No AWS keys live in this repo.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Still explicit: v5 added automatic caching, but only off a
          # `packageManager` field in package.json, which this repo has none of.
          cache: npm

      - run: npm ci

      - run: npm run test

      # Typechecks as part of the build script. The backup token it compiles in
      # comes from src/lib/backupToken.ts, so there is nothing to configure here.
      - run: npm run build

      # v6 is the current major. Its default OIDC audience is still
      # sts.amazonaws.com, which the deploy role's trust policy pins — check
      # that before taking the next major.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-2

      - run: ./scripts/deploy.sh
