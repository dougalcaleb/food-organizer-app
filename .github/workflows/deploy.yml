name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Credentials come from the account's GitHub OIDC provider, exchanged for the
# deploy role created by infra/hosting.yaml. No AWS keys live in this repo.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test

      # Typechecks as part of the build script.
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-2

      - run: ./scripts/deploy.sh
