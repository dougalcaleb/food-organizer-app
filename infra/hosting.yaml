AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Static hosting for Pantry: a private S3 bucket fronted by CloudFront, plus an
  IAM role GitHub Actions assumes via OIDC to deploy. Costs nothing at this
  scale: CloudFront's 1 TB/month free tier is perpetual, and the bucket holds
  well under a megabyte. There is deliberately no Route 53 hosted zone and no
  ACM certificate -- the assigned *.cloudfront.net domain is free and already
  serves HTTPS, which the PWA will need.

  It also carries the cloud backup: a second, versioned bucket written by a
  small Lambda behind a /api/backup behavior on the same distribution. Same
  origin, so the app needs no CORS and no second domain.

Parameters:
  GitHubOwner:
    Type: String
    Default: dougalcaleb
    Description: GitHub account that owns the repository.
  GitHubRepo:
    Type: String
    Default: food-organizer-app
    Description: Repository name, without the owner prefix.
  # GitHub now issues an "immutable" subject claim that qualifies both names
  # with their numeric ids -- see the trust policy below for why both forms are
  # matched. `gh api users/OWNER --jq .id` and `gh api repos/OWNER/REPO --jq .id`.
  GitHubOwnerId:
    Type: String
    Default: '35942679'
    Description: Numeric id of the owner, used by the immutable subject claim.
  GitHubRepoId:
    Type: String
    Default: '1343116230'
    Description: Numeric id of the repository, used by the immutable subject claim.
  GitHubBranch:
    Type: String
    Default: main
    Description: Only this branch may assume the deploy role.
  # NOT a secret, and deliberately not NoEcho. The same value is compiled into
  # the public JS bundle from src/lib/backupToken.ts, so anyone who reads the
  # source has it. It exists to stop drive-by writes from someone who merely
  # guesses the distribution's domain, not to protect the data -- see the
  # "Cloud backup" section of CLAUDE.md for why that trade is acceptable here.
  # Left empty, the endpoint rejects every request, so an unconfigured stack is
  # closed rather than open.
  BackupToken:
    Type: String
    Default: ''
    Description: Shared bearer token. Public by design; rotate by redeploying both stack and site.
  # Deliberately has no default and is never committed: this repository is
  # public. `scripts/infra.sh` takes it once from BUDGET_ALERT_EMAIL and reads
  # it back off the stack thereafter.
  BudgetAlertEmail:
    Type: String
    Default: ''
    Description: Where to send the cost alarm. Empty leaves the alarm off.

Conditions:
  HasBudgetAlert: !Not [!Equals [!Ref BudgetAlertEmail, '']]

Resources:
  # Private. CloudFront reaches it over the REST endpoint with Origin Access
  # Control, so S3 static website hosting is deliberately NOT enabled -- that
  # mode requires a public bucket and cannot speak HTTPS to the origin.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: Lets only this distribution read the site bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} -- Pantry'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # NA + EU edges only: the cheapest class, and this app has one user.
        PriceClass: PriceClass_100
        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          # The backup API, as a second origin on this same distribution so the
          # app calls it same-origin: no CORS preflight, no second domain, and
          # nothing to configure in the client beyond a path.
          - Id: BackupFunctionOrigin
            DomainName: !Select [2, !Split ['/', !GetAtt BackupFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols: [TLSv1.2]
        CacheBehaviors:
          # Uncached and all methods forwarded. AllViewerExceptHostHeader is the
          # policy to use for a Lambda function URL origin: the function needs
          # the Authorization header, but Host must stay the origin's own or the
          # URL rejects the request.
          - PathPattern: /api/backup
            TargetOriginId: BackupFunctionOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            # Managed-CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed-AllViewerExceptHostHeader
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-SecurityHeadersPolicy: HSTS, nosniff, frame-deny, referrer.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        # The SPA rewrite GitHub Pages never had. A private bucket answers a
        # missing key with 403 (not 404), because ListBucket is not granted --
        # so both have to be mapped. Routing is hash-based today and does not
        # need this; it is here so switching to path history is a one-line
        # change rather than a broken cold load.
        #
        # These apply to the WHOLE distribution -- there is no way to scope them
        # to one behavior -- so /api/backup must never answer 403 or 404 or the
        # client receives index.html with a 200. The Lambda uses 401 and a
        # 200 {present:false} instead; see the note in its code.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # Assumed by GitHub Actions through the account's existing OIDC provider, so
  # no long-lived access keys are stored as repository secrets.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Deploys the Pantry site from GitHub Actions.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Two forms, because GitHub changed the shape of this claim. The
              # classic one is `repo:owner/name:ref:...`; the immutable one
              # qualifies both halves with their numeric ids, which a rename
              # cannot recycle. A repository issuing the immutable form against
              # a policy that lists only the classic one fails as
              # "Not authorized to perform sts:AssumeRoleWithWebIdentity" --
              # indistinguishable from a missing role. Both are matched so a
              # rollout either way keeps deploying; StringLike ORs the list.
              # Do NOT collapse these to a wildcard: `dougalcaleb*` would also
              # match an account someone else registers as `dougalcaleb2`.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
                  - !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: publish-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # `scripts/deploy.sh` reads the bucket name and distribution id
              # from this stack's outputs rather than keeping them in the repo,
              # so the role has to be able to look them up. Scoped to this one
              # stack by its id, which is the exact ARN -- no wildcard needed,
              # and a deleted-and-recreated stack rebuilds the role with the
              # new one. Read-only: CI never alters infrastructure.
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref 'AWS::StackId'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ── Cloud backup ─────────────────────────────────────────────────────────
  #
  # Versioned, because the endpoint is open to anyone who reads the token out
  # of the bundle: the recovery story for a junk or malicious write is "roll
  # back to the previous version", not "hope". Ninety days of history costs
  # cents at this size. Separate from SiteBucket so a deploy's `aws s3 sync
  # --delete` can never reach it.
  BackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  BackupFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets the Pantry backup function read and write the one backup object.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: backup-object
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # One key, and no DeleteObject: the function cannot destroy
              # history even if the token leaks, which it is expected to.
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${BackupBucket.Arn}/backup.json'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${BackupFunctionLogs.Arn}:*'

  # Explicit, so the logs expire. Lambda would create this itself with no
  # retention at all, and named here because the function's name is fixed
  # below (deriving it from !Ref would be circular).
  BackupFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-backup'
      RetentionInDays: 14

  # Inline on purpose: it is under a hundred lines, and a bundled artifact
  # would mean an S3 upload step before `npm run infra` could work at all.
  # CloudFormation caps inline code at 4096 characters -- if this outgrows
  # that, move it to its own file and package it, do not start golfing it.
  BackupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-backup'
      Description: Stores and returns the Pantry database backup.
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt BackupFunctionRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          BUCKET: !Ref BackupBucket
          KEY: backup.json
          TOKEN: !Ref BackupToken
      Code:
        ZipFile: |
          const { S3Client, GetObjectCommand, PutObjectCommand } = require('@aws-sdk/client-s3')

          const s3 = new S3Client({})
          const { BUCKET, KEY, TOKEN } = process.env
          const MAX_BYTES = 2 * 1024 * 1024

          // NEVER answer 403 or 404: the distribution rewrites both to
          // index.html with a 200 for the SPA, and cannot scope that to one
          // behavior. 401 and 400 pass through untouched.
          const json = (statusCode, body) => ({
            statusCode,
            headers: { 'content-type': 'application/json', 'cache-control': 'no-store' },
            body: JSON.stringify(body),
          })

          exports.handler = async (event) => {
            const method = event.requestContext?.http?.method ?? 'GET'
            const auth = event.headers?.authorization ?? ''

            // An unset token closes the endpoint rather than opening it.
            if (!TOKEN || auth !== 'Bearer ' + TOKEN) return json(401, { error: 'unauthorized' })

            if (method === 'GET') {
              try {
                const res = await s3.send(new GetObjectCommand({ Bucket: BUCKET, Key: KEY }))
                return json(200, {
                  present: true,
                  savedAt: res.LastModified?.toISOString() ?? null,
                  backup: JSON.parse(await res.Body.transformToString()),
                })
              } catch (err) {
                if (err?.name === 'NoSuchKey') return json(200, { present: false })
                throw err
              }
            }

            if (method === 'PUT') {
              const body = event.isBase64Encoded
                ? Buffer.from(event.body ?? '', 'base64').toString('utf8')
                : (event.body ?? '')

              if (Buffer.byteLength(body, 'utf8') > MAX_BYTES) return json(413, { error: 'too large' })

              let parsed
              try {
                parsed = JSON.parse(body)
              } catch {
                return json(400, { error: 'not json' })
              }

              if (parsed?.format !== 'food-organizer-backup' || !Array.isArray(parsed.meals)) {
                return json(400, { error: 'not a backup' })
              }

              // The client refuses this too. Both checks are deliberate: this
              // is the write that would otherwise overwrite a good backup with
              // an empty database after the browser evicts IndexedDB.
              if (parsed.meals.length === 0) return json(400, { error: 'refusing an empty backup' })

              await s3.send(
                new PutObjectCommand({
                  Bucket: BUCKET,
                  Key: KEY,
                  Body: body,
                  ContentType: 'application/json',
                }),
              )

              return json(200, { ok: true, savedAt: new Date().toISOString() })
            }

            return json(405, { error: 'method not allowed' })
          }

  # AuthType NONE because the caller is a browser with no AWS credentials; the
  # bearer check in the function is the whole gate. CloudFront's OAC would be
  # the tighter option, but signing a request body through it needs an extra
  # CloudFront Function to compute x-amz-content-sha256, which is more moving
  # parts than this earns.
  BackupFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt BackupFunction.Arn
      AuthType: NONE

  # DependsOn is load bearing. Nothing in this resource's properties mentions
  # the URL, so CloudFormation is free to create the two in parallel -- and it
  # did, landing the permission ~150ms BEFORE the URL existed. The stack came
  # up green and every anonymous request to the URL was answered
  # `403 AccessDeniedException` by Lambda's own auth layer, with the resource
  # policy reading exactly as it should and the handler never invoked (no log
  # streams at all is the tell). Through the distribution that 403 becomes the
  # SPA fallback, so the app reports "returned something unexpected".
  #
  # The ordering is the only thing that differed from a working setup -- AWS
  # does not document it as a constraint, so treat the mechanism as unconfirmed
  # and this as the arrangement that is known to work. What is certain is that
  # re-creating the permission against an existing URL fixes it.
  #
  # Note that AWS::Lambda::Permission has no updatable properties: every change
  # replaces it. That is what lets a redeploy repair an already-broken stack.
  BackupFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    DependsOn: BackupFunctionUrl
    Properties:
      FunctionName: !Ref BackupFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  # ── Cost alarm ───────────────────────────────────────────────────────────
  #
  # Everything here is meant to sit inside a free tier forever, which means any
  # bill at all is a signal rather than a degree. The specific thing worth
  # catching: /api/backup is open to anyone who reads the token out of the
  # bundle, nothing rate-limits it, and a rejected request still costs a Lambda
  # invocation -- so the one unbounded quantity in this stack is somebody
  # hammering an endpoint that answers 401.
  #
  # SCOPED to this project, not account-wide. It was account-wide first, on the
  # reasoning that a surprise bill is worth knowing about wherever it comes
  # from -- but this account runs other, larger projects, so an account-wide
  # budget set low enough to notice a few dollars of Lambda here would fire
  # constantly on things that have nothing to do with it. An alarm that cries
  # wolf is an alarm that gets ignored, which is worse than none.
  #
  # Scoping is by cost allocation tag. That has two consequences worth knowing
  # before trusting this: the `Project` tag has to be ACTIVATED as a cost
  # allocation tag (scripts/infra.sh does it, it is not a CloudFormation
  # resource), and activation is not retroactive -- it can take up to 24 hours
  # to start appearing and never backfills. A brand new stack therefore has a
  # blind first day. The stack tag itself is applied by `--tags` in infra.sh
  # and propagates to every resource here that supports tagging.
  ProjectBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetAlert
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
        # Keep in step with the --tags argument in scripts/infra.sh;
        # cloudBackupInfra.spec.ts guards that the two still agree.
        CostFilters:
          TagKeyValue:
            - 'user:Project$pantry'
      NotificationsWithSubscribers:
        # A dollar of actual spend on resources that should cost nothing is
        # already the interesting event; the limit only gives it a scale.
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 20
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        # Forecast catches a run-up early in the month, while it is still
        # cheap to go and turn something off.
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

Outputs:
  BucketName:
    Description: Sync the contents of dist/ here.
    Value: !Ref SiteBucket
  DistributionId:
    Description: Invalidate this after a deploy.
    Value: !Ref Distribution
  SiteUrl:
    Description: The live app.
    Value: !Sub 'https://${Distribution.DomainName}'
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE repository variable in GitHub.
    Value: !GetAtt DeployRole.Arn
  BackupBucketName:
    Description: Holds backup.json, versioned. Roll back here if a bad backup lands.
    Value: !Ref BackupBucket
  BackupApiUrl:
    Description: The app calls this same-origin; nothing needs to be configured with it.
    Value: !Sub 'https://${Distribution.DomainName}/api/backup'
